    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19C3C8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#19C3C8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#dots)"/>
  <circle cx="220" cy="190" r="200" fill="url(#glow)">
    <animate attributeName="r" values="180;215;180" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </circle>

  <g opacity="0.3"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1280 0" dur="26s" repeatCount="indefinite"/><path d="M-200,372 Q120,336 440,372 T1080,372 T1720,372 T2360,372 T3000,372 T3640,372 T4280,372 L4280,440 L-200,440 Z" fill="url(#flow)" /></g>
  <g opacity="0.5"><animateTransform attributeName="transform" type="translate" from="-640 0" to="0 0" dur="18s" repeatCount="indefinite"/><path d="M0,392 Q160,364 320,392 T640,392 T960,392 T1280,392 T1600,392 T1920,392 T2240,392 T2560,392 T2880,392 T3200,392 T3520,392 T3840,392 L3840,440 L0,440 Z" fill="url(#flow)" /></g>
  <g opacity="0.95"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1280 0" dur="12s" repeatCount="indefinite"/><path d="M-640,412 Q-320,392 0,412 T640,412 T1280,412 T1920,412 T2560,412 T3200,412 T3840,412 L3840,440 L-640,440 Z" fill="url(#flow)" /></g>

