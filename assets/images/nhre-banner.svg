<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="NHRE — National Healthcare Record Exchange" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#19C3C8"/>
      <stop offset="0.35" stop-color="#7BE3EE"/>
      <stop offset="0.7" stop-color="#1976D2"/>
      <stop offset="1" stop-color="#19C3C8"/>
