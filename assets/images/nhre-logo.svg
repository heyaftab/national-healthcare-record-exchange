<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NHRE secure healthcare record exchange</title>
  <desc id="desc">NHRE wordmark with a medical cross, patient record and security shield</desc>
  <defs>
    <linearGradient id="nhre-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19C3C8"/>
      <stop offset="1" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="nhre-cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19C3C8"/>
      <stop offset="1" stop-color="#008F91"/>
    </linearGradient>
    <filter id="nhre-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#062A45" flood-opacity=".25"/>
    </filter>
  </defs>

  <path d="M37 80A93 93 0 0 0 120 213c35 0 67-19 84-48" fill="none" stroke="url(#nhre-teal)" stroke-width="13" stroke-linecap="round"/>
  <path d="M78 31a94 94 0 0 1 125 65" fill="none" stroke="url(#nhre-teal)" stroke-width="13" stroke-linecap="round"/>

  <g filter="url(#nhre-shadow)">
    <path d="M67 37h18V55h18v18H85v18H67V73H49V55h18z" fill="url(#nhre-cross)" stroke="#19C3C8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M53 64h8l4-7 5 18 5-25 5 19 4-9h12" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="35" y="139" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800" letter-spacing="-4">NH</text>
  <text x="111" y="139" fill="url(#nhre-teal)" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800" letter-spacing="-4">RE</text>

  <g filter="url(#nhre-shadow)">
    <path d="M91 154h56l14 14v47H91z" fill="#FFFFFF" stroke="#D9EAF0" stroke-width="2" stroke-linejoin="round"/>
    <path d="M147 154v14h14" fill="#EAF6FA" stroke="#D9EAF0" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="109" cy="176" r="7" fill="#062A45"/>
    <path d="M98 193c2-9 20-9 22 0" fill="#062A45"/>
    <path d="M129 176h21M129 185h21M99 204h45" fill="none" stroke="#062A45" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#nhre-shadow)">
    <path d="M158 191l19-8 19 8v17c0 14-10 22-19 26-9-4-19-12-19-26z" fill="#062A45" stroke="#19C3C8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M168 207v-5a9 9 0 0 1 18 0v5m-18 0h18v12h-18z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="177" cy="213" r="2" fill="#062A45"/>
  </g>
</svg>
